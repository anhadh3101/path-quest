[project]
name = "context-layer"
version = "0.1.0"
description = "Context layer for the browser-use agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymongo>=4.9",
    "python-dotenv>=1.0",
    "openai>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["context_layer"]
